name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Build ESP32-C3 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build firmware
        run: pio run

      - name: Package browser installer
        run: python3 scripts/package_web_installer.py

      - name: Upload browser installer
        uses: actions/upload-artifact@v4
        with:
          name: web-installer
          path: dist/

  publish-pages:
    name: Publish browser installer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download browser installer
        uses: actions/download-artifact@v4
        with:
          name: web-installer
          path: dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  host-tests:
    name: Run host timer tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile and run tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/mouse_activity_tests.cpp -o /tmp/mouse_activity_tests
          /tmp/mouse_activity_tests
