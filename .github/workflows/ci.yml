name: Build and test

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Build ESP32-C3 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build firmware
        run: pio run

      - name: Package browser installer
        env:
          FIRMWARE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
        run: python3 scripts/package_web_installer.py --version "$FIRMWARE_VERSION"

      - name: Upload browser installer
        uses: actions/upload-artifact@v4
        with:
          name: web-installer
          path: dist/

  release:
    name: Publish versioned firmware release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download versioned firmware deliverables
        uses: actions/download-artifact@v4
        with:
          name: web-installer
          path: dist/

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              dist/firmware.bin \
              dist/manifest.json \
              dist/version.json \
              dist/firmware.bin.sha256 \
              --clobber
          elif [[ "$TAG_NAME" == *-* ]]; then
            gh release create "$TAG_NAME" \
              dist/firmware.bin \
              dist/manifest.json \
              dist/version.json \
              dist/firmware.bin.sha256 \
              --generate-notes \
              --prerelease
          else
            gh release create "$TAG_NAME" \
              dist/firmware.bin \
              dist/manifest.json \
              dist/version.json \
              dist/firmware.bin.sha256 \
              --generate-notes
          fi

  publish-pages:
    name: Publish browser installer
    if: >-
      always() &&
      needs.firmware.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs:
      - firmware
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download browser installer
        uses: actions/download-artifact@v4
        with:
          name: web-installer
          path: dist/

      - name: Mirror published firmware versions to Pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || continue
            version_dir="dist/versions/$tag"
            mkdir -p "$version_dir"
            gh release download "$tag" \
              --repo "$GH_REPO" \
              --pattern manifest.json \
              --pattern firmware.bin \
              --dir "$version_dir"
            test -s "$version_dir/manifest.json"
            test -s "$version_dir/firmware.bin"
          done < <(
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.draft == false and any(.assets[]; .name == "manifest.json") and any(.assets[]; .name == "firmware.bin")) | .tag_name'
          )

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  host-tests:
    name: Run host timer tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile and run tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/mouse_activity_tests.cpp -o /tmp/mouse_activity_tests
          /tmp/mouse_activity_tests
